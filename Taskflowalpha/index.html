<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - gerenciador de tarefas para portfólio de Engenharia de Software">
  <title>TaskFlow | Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="app-card">
      <header class="header">
        <div>
          <p class="eyebrow">PORTFÓLIO • ENGENHARIA DE SOFTWARE</p>
          <h1>TaskFlow</h1>
          <p class="subtitle">Organize suas tarefas de forma simples e eficiente.</p>
        </div>
        <span class="badge">v1.0</span>
      </header>

      <form id="taskForm" class="task-form">
        <label for="taskInput" class="sr-only">Nova tarefa</label>
        <input id="taskInput" type="text" maxlength="100" placeholder="Ex.: Estudar JavaScript" autocomplete="off" required>
        <button type="submit">Adicionar</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filtros">
          <button class="filter active" data-filter="all">Todas</button>
          <button class="filter" data-filter="pending">Pendentes</button>
          <button class="filter" data-filter="completed">Concluídas</button>
        </div>
        <span id="taskCount">0 tarefas</span>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <h2>Nenhuma tarefa por aqui</h2>
        <p>Adicione sua primeira tarefa acima.</p>
      </div>

      <footer class="footer">
        <span>Dados salvos localmente no navegador</span>
        <button id="clearCompleted" class="link-button">Limpar concluídas</button>
      </footer>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
